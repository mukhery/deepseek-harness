# The `crew-director` agent preset: the Director role for a workspace-scoped
# crew of long-running agents (see packages/crew/README.md and the
# Director-led crew Agent Note). One preset serves both uses described there:
# the standing thread a user starts once and leaves running, and any number
# of later ad hoc/escalation threads — both are ordinary sessions on this
# exact composition, sharing crew state only through the workspace-scoped
# ctx.crew domain (host-plane, mounted in the web-app bundle), never through
# this preset's own realm.
#
# Requires the web-app bundle: ctx.crew and ctx.workspaceRegistry both need
# ctx.storageDomain, which the base bundle does not mount (workspace is a
# web-GUI-sidebar concept there). A headless/plain-CLI composition has no
# workspace to scope crew state by, so this preset does not support it.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are the Director of a crew of agents pursuing one long-running project rooted at {{cwd}}. Hire crew members into fixed roles (researcher, strategist, engineer, reviewer) with crew_hire, open and assign tickets with crew_open_ticket/crew_assign_ticket, and check crew_board periodically. You do not do the crew's work yourself. A worker's own report never closes a ticket — only an independent reviewer's verdict does.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── crew tools ──────────────────────────────────────────────────────────────
#
# None of the three packages provides a service (ctx.crew is the host-plane
# row in the web-app bundle), so none needs an isolate realm — but all three
# stay preset-scoped here rather than host-global: a host-global tool row is
# visible to EVERY session on EVERY preset, so mounting e.g. tool-crew-review
# at the host layer would put crew_verdict on the standard/minimal/code/cordis
# presets' tool catalogs too, not just this one. Mounting tool-crew-member and
# tool-crew-review here, not only tool-crew-director, gives the Director's own
# session direct crew_read_pool/crew_publish (useful for board reviews) and
# technically crew_verdict/crew_report too — harmless since ctx.crew itself
# rejects a caller who was never hired as the ticket's assignee/reviewer (see
# packages/crew/crew/README.md), which is the actual enforcement, not tool
# visibility. Hired children inherit whichever of these names their own
# `toolFilter.allow` (set at crew_hire time) actually lists.
- id: tool-crew-director
  name: '@deepseek-ai/dsh-tool-crew-director'
  config:
    provider: spawn
    # Extra tool names unioned onto each role's fixed crew tools at hire time
    # (dsh-tool-crew-director's Config.roleToolAllow) — model-facing tool
    # NAMES (defineTool's own `name`), not the cordis row ids below that
    # register them, and deployment-owned because they vary by deployment. An
    # engineer gets full read/write access to implement a ticket (in its own
    # git worktree via ordinary `git worktree add` through bash — there is no
    # separate worktree tool); a reviewer gets the same tools read-only in
    # effect, since its role never assigns it a ticket to legitimately write
    # against, and independently re-running checks or reading a diff needs
    # real fs/shell access, not just the pool.
    #
    # `ctx.tools.restrict()` throws loudly on a name that never registered in
    # scope, and this preset's own rows below `disabled` one of bash/pwsh per
    # `process.platform` — so the shell tool name must be picked the same way,
    # never both listed unconditionally.
    roleToolAllow: !!js >-
      process.platform === 'win32'
        ? { engineer: ['pwsh', 'read', 'write', 'edit', 'glob', 'grep'], reviewer: ['pwsh', 'read', 'glob', 'grep'] }
        : { engineer: ['bash', 'read', 'write', 'edit', 'glob', 'grep'], reviewer: ['bash', 'read', 'glob', 'grep'] }

- id: tool-crew-member
  name: '@deepseek-ai/dsh-tool-crew-member'

- id: tool-crew-review
  name: '@deepseek-ai/dsh-tool-crew-review'

# ── crew oversight ──────────────────────────────────────────────────────────
#
# list_agents/interrupt_agent (plus the root package's send_message) give the
# Director visibility over hired children and a stop switch independent of
# the ticket-assignment path.
- id: tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'

- id: tool-subagent-list-agents
  name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

# ── the Director's own long-running objective ───────────────────────────────
#
# ctx.goals/dsh-goal-round-driver are host-plane (base bundle); this preset
# only needs the model-facing tool, same as the standard preset. Session-local
# reminders (dsh-schedule) drive the standing thread's periodic "check the
# board" cadence; the package publishes no service, so it needs no realm
# either (packages/schedule/README.md).
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

- id: schedule
  name: '@deepseek-ai/dsh-schedule'

# ── compaction ──────────────────────────────────────────────────────────────
#
# A standing thread accumulates crew-board check-ins indefinitely; unlike a
# short coding session, compaction is not optional here. Mirrors the standard
# preset's isolated group.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── basic inspection and interaction ────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
